name: 手动打包部署(CI+CD)
on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 自动根据当前分支判断环境 ✅ 核心
      - name: 设置环境变量
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "BUILD_CMD=pnpm run build:dev" >> $GITHUB_ENV
            echo "ENV_DIR=dev" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
            echo "BUILD_CMD=pnpm run build:test" >> $GITHUB_ENV
            echo "ENV_DIR=test" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "BUILD_CMD=pnpm run build:prod" >> $GITHUB_ENV
            echo "ENV_DIR=prod" >> $GITHUB_ENV
          fi

      - name: 安装依赖
        run: pnpm install --registry=https://registry.npmjs.org

      - name: 打包项目（自动识别环境）
        run: ${{ env.BUILD_CMD }}

      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ env.ENV_DIR }}     # 👈 新增 4